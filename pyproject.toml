[project]
name = "console-check"
version = "2.0.0"
description = "CLI tool for verifying Cisco device readiness on Cradlepoint console ports before SDWAN migration cutovers"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.3",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.6.1",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
console-check = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
python-preference = "system"

[tool.pytest.ini_options]
testpaths = ["tests"]
