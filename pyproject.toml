[project]
name = "console-check"
version = "3.0.0"
description = "CLI tool for automated Cradlepoint console port verification via NCM browser automation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.3",
    "rapidfuzz>=3.6.1",
    "rich>=13.0",
    "questionary>=2.0",
    "playwright>=1.40",
]

[project.scripts]
console-check = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
python-preference = "system"

[tool.pytest.ini_options]
testpaths = ["tests"]
