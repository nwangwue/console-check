[project]
name = "console-check"
version = "1.0.0"
description = "Site readiness verification tool for SDWAN migration cutovers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.3",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.6.1",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.3",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
