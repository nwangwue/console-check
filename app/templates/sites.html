{% extends "base.html" %}
{% block title %}Sites — console-check{% endblock %}
{% block content %}
<h1>Sites</h1>

<div class="search-bar">
    <input type="text" id="search-input" placeholder="Search by site ID, city, bank name, UNLOCODE, or hostname...">
    <button class="btn btn-primary" onclick="doSearch()">Search</button>
</div>

<div class="filter-bar">
    <select id="filter-status" onchange="doSearch()">
        <option value="">All Statuses</option>
        <option value="not_checked">Not Checked</option>
        <option value="ready">Ready</option>
        <option value="issues">Issues</option>
        <option value="partial">Partial</option>
    </select>
    <select id="filter-type" onchange="doSearch()">
        <option value="">All Types</option>
        <option value="single">Single</option>
        <option value="ha">HA</option>
    </select>
    <span id="result-count" style="color:#64748b;font-size:0.85rem"></span>
</div>

<table class="data-table" id="sites-table">
    <thead>
        <tr>
            <th>Site ID</th>
            <th>City, State</th>
            <th>Bank Name</th>
            <th>CP Search Key</th>
            <th>Type</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="pagination" id="pagination"></div>

{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

document.getElementById('search-input').addEventListener('keyup', e => {
    if (e.key === 'Enter') doSearch();
});

async function doSearch(page = 1) {
    currentPage = page;
    const q = document.getElementById('search-input').value;
    const status = document.getElementById('filter-status').value;
    const siteType = document.getElementById('filter-type').value;

    const params = new URLSearchParams({ q, status, site_type: siteType, page, per_page: 25 });
    const resp = await fetch(`/api/sites?${params}`);
    const data = await resp.json();

    const tbody = document.querySelector('#sites-table tbody');
    tbody.innerHTML = '';
    document.getElementById('result-count').textContent = `${data.total} site(s) found`;

    data.items.forEach(site => {
        const tr = document.createElement('tr');
        tr.className = 'clickable';
        tr.onclick = () => window.location.href = `/sites/${site.id}/verify`;
        tr.innerHTML = `
            <td>${site.id}</td>
            <td>${site.city}, ${site.state}</td>
            <td>${site.bank_name}</td>
            <td><strong>${site.cp_search_key || '—'}</strong></td>
            <td>${site.site_type.toUpperCase()}</td>
            <td><span class="badge badge-${site.status}">${site.status.replace('_', ' ')}</span></td>
        `;
        tbody.appendChild(tr);
    });

    // Pagination
    const totalPages = Math.ceil(data.total / data.per_page);
    const pag = document.getElementById('pagination');
    pag.innerHTML = '';
    if (totalPages > 1) {
        for (let i = 1; i <= Math.min(totalPages, 10); i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            if (i === currentPage) btn.className = 'active';
            btn.onclick = () => doSearch(i);
            pag.appendChild(btn);
        }
    }
}

// Load on page open
doSearch();
</script>
{% endblock %}
